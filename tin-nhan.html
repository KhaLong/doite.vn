<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tin nhắn — doite.vn</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cg fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' transform='translate(4.8 4.8) scale(.6)'%3E%3Cpath d='m17 2 4 4-4 4'/%3E%3Cpath d='M3 6h18'/%3E%3Cpath d='m7 22-4-4 4-4'/%3E%3Cpath d='M21 18H3'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Bộ mặt Soft: font Be Vietnam Pro (DESIGN.md) -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Allowlisted Tailwind Script (Tailwind v3 play CDN) -->
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script>
    // Cùng cấu hình với index.html: Tailwind chỉ trỏ tên lớp vào biến ở :root.
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["var(--app-font)"] },
          colors: {
            background: "var(--background)",
            surface: "var(--surface)",
            foreground: "var(--foreground)",
            muted: "var(--muted)",
            border: "var(--border)",
            "border-strong": "var(--border-strong)",
            primary: { DEFAULT: "var(--primary)", hover: "var(--primary-hover)", foreground: "var(--primary-foreground)", light: "var(--primary-light)" },
            "item-hover": "var(--item-hover)",
            success: { DEFAULT: "var(--success)", bg: "var(--success-bg)" },
            warning: { DEFAULT: "var(--warning)", bg: "var(--warning-bg)" },
            danger: { DEFAULT: "var(--danger)", bg: "var(--danger-bg)" },
          },
        },
      },
    };
  </script>
  <style>
    /* Token của doite.vn — giữ khớp khối :root trong index.html */
    :root {
      color-scheme: light;
      --app-font: "Be Vietnam Pro", "Inter", ui-sans-serif, system-ui, sans-serif;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-foreground: #ffffff;
      --primary-light: #eff6ff;
      --background: #f4f4f6;
      --surface: #ffffff;
      --foreground: #2c2c2c;
      --muted: #707070;
      --border: #f0f0f2;
      --border-strong: #d4d4d8;
      --border-focus: var(--primary);
      --ring-focus: color-mix(in srgb, var(--primary) 15%, transparent);
      --item-hover: #e8e8ec;
      --success: #15803d;
      --success-bg: #f0fdf4;
      --warning: #b45309;
      --warning-bg: #fffbeb;
      --danger: #dc2626;
      --danger-border: #ef4444;
      --danger-bg: #fef2f2;
      /* Màu theo loại giao dịch (chấm trước nhãn), như loại tin ở trang chủ */
      --cat-sell: #15803d;
      --cat-buy: #2563eb;
      --cat-pay: #7c3aed;
    }
    body { font-family: var(--app-font); background: var(--background); color: var(--foreground); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    [hidden] { display: none !important; }
    * { scrollbar-width: thin; scrollbar-color: #c4c4c8 transparent; }
    .tabular { font-variant-numeric: tabular-nums; }
    .pretty { text-wrap: pretty; }
    /* Hàng tab cuộn ngang trên màn hẹp: mép phải mờ báo còn tab (như trang chủ) */
    .scrollbar-none { scrollbar-width: none; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .fade-right { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); }
    @media (min-width: 768px) { .fade-right { -webkit-mask-image: none; mask-image: none; } }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 9999px; background: currentColor; }
    /* Thanh trượt phóng to trong hộp chỉnh ảnh: rãnh 4px, tay cầm 20px viền 2px, vùng chạm cả dải h-11 */
    .zoom-range { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
    .zoom-range::-webkit-slider-runnable-track { height: 4px; border-radius: 9999px; background: linear-gradient(to right, var(--primary) var(--fill, 0%), #e4e4e7 var(--fill, 0%)); }
    .zoom-range::-moz-range-track { height: 4px; border-radius: 9999px; background: #e4e4e7; }
    .zoom-range::-moz-range-progress { height: 4px; border-radius: 9999px; background: var(--primary); }
    .zoom-range::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 9999px; border: 2px solid var(--primary); background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.15); }
    .zoom-range::-moz-range-thumb { width: 16px; height: 16px; border-radius: 9999px; border: 2px solid var(--primary); background: #fff; }
    .zoom-range:focus-visible { outline: none; }
    .zoom-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--ring-focus); }
    .zoom-range:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px var(--ring-focus); }
    @keyframes overlay-in { from { opacity: 0; } }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
    .overlay-in { animation: overlay-in 150ms ease-out; }
    .dialog-in { animation: dialog-in 180ms ease-out; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
  <!-- Hiệu ứng chuyển trang (page-transitions.css), bản dự phòng cho trình duyệt cũ (page-transitions.js) -->
  <link rel="stylesheet" href="/page-transitions.css" />
  <script src="/page-transitions.js"></script>
  <!-- Kết nối thời gian thực dùng chung (SSE /api/events) -->
  <script src="/live.js"></script>
</head>
<body>
  <div id="app"></div>

<script>
// doite.vn — Tin nhắn (DESIGN.md). API /api/messages* (src/messages.rs), thời gian thực qua /live.js (src/realtime.rs).
// Máy tính: danh sách hội thoại trái, khung chat phải. Điện thoại: một màn một lúc (danh sách ↔ hội thoại).
// ?u=<tên> mở (hoặc tạo) hội thoại với người đó; &tin=<nhãn tin> soạn sẵn câu chào giá. ?c=<id> giữ hội thoại đang mở.
//
// Thời gian thực, và vì sao không mất hay lặp tin:
// - Tin mới, "Đã xem", "đang soạn tin" đến qua SSE. Mất kết nối thì live.js tự nối lại; nối xong lấy bù
//   tin có id lớn hơn tin cuối đang có (catchUp). SSE hỏng hẳn thì tải định kỳ 5 giây.
// - Gửi lạc quan: tin hiện ngay ("Đang gửi…"), kèm clientId. Server gặp lại clientId thì trả tin cũ, nên
//   gửi lại sau lỗi mạng không tạo tin trùng. Tin chưa gửi được có nút "Gửi lại". Gửi lần lượt, đúng thứ tự gõ.
// - Mọi tin gộp qua upsert (khớp clientId rồi id), sắp theo id: echo SSE và phản hồi POST đến thứ tự nào cũng ra một tin.
// - Chỉ đánh dấu đã xem khi hội thoại đang mở và tab đang hiện.
// - Tin đến khi đang gõ: chỉ vẽ lại khung tin, không vẽ lại ô nhập (gõ tiếng Việt không bị ngắt).
//
// Thêm loại tin (ảnh, đề nghị tỷ giá…): thêm một mục vào KINDS (cách vẽ bong bóng + câu xem trước),
// và nhánh tương ứng trong validate_kind ở src/messages.rs.

const ICONS = {
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  "message-circle": '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  "arrow-left": '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  "arrow-down": '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
  send: '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
  "circle-alert": '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  "wifi-off": '<path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>',
  "rotate-cw": '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
};
const icon = (name, cls = "h-4 w-4") =>
  `<svg class="lucide lucide-${name} ${cls} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
const SPINNER = `<svg class="h-4 w-4 shrink-0 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>`;
const SPINNER_SM = SPINNER.replace("h-4 w-4", "h-3 w-3");
const LOGO = `<svg class="h-4 w-4 sm:h-5 sm:w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 6h18"/><path d="m7 22-4-4 4-4"/><path d="M21 18H3"/></svg>`;
const esc = (text) => String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const $ = (selector) => document.querySelector(selector);
const initialsOf = (name) => {
  const words = String(name).trim().split(/\s+/);
  return (words.length > 1 ? words[0][0] + words[words.length - 1][0] : words[0].slice(0, 2)).toUpperCase();
};
const TZ = "Asia/Ho_Chi_Minh";
const dayKey = (date) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(date);
const timeOf = (iso) => new Intl.DateTimeFormat("vi-VN", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso));
function shortWhen(iso) {
  if (!iso) return "";
  const date = new Date(iso);
  if (dayKey(date) === dayKey(new Date())) return timeOf(iso);
  return new Intl.DateTimeFormat("vi-VN", { timeZone: TZ, day: "2-digit", month: "2-digit" }).format(date);
}
function dayLabel(iso) {
  const date = new Date(iso);
  const days = Math.round((new Date(dayKey(new Date())) - new Date(dayKey(date))) / 86400000);
  if (days === 0) return "Hôm nay";
  if (days === 1) return "Hôm qua";
  return new Intl.DateTimeFormat("vi-VN", { timeZone: TZ, day: "2-digit", month: "2-digit", year: "numeric" }).format(date);
}
const uuid = () =>
  crypto.randomUUID?.() ??
  ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
const nearBottom = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 80;

const ring = "outline-none focus-visible:bg-item-hover";
const btnPrimary = "relative inline-flex h-10 shrink-0 cursor-pointer items-center justify-center gap-2 rounded-xl bg-primary px-4 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary-hover outline-none focus-visible:bg-primary-hover";
const btnSecondary = "inline-flex h-9 shrink-0 cursor-pointer items-center justify-center gap-2 rounded-xl border border-border-strong bg-surface px-3 text-sm font-medium text-foreground transition-colors hover:bg-item-hover outline-none focus-visible:bg-item-hover";
function avatarOf(name, url, size = "h-10 w-10", text = "text-sm") {
  if (url) return `<img src="${esc(url)}" alt="" class="${size} shrink-0 rounded-full bg-[#ececef] object-cover">`;
  return `<span class="${size} inline-flex shrink-0 items-center justify-center rounded-full bg-[#ececef] ${text} font-semibold text-foreground" aria-hidden="true">${esc(initialsOf(name))}</span>`;
}

// ---------------------------------------------------------------- loại tin
// Mỗi loại: bubble(tin) → HTML bên trong bong bóng; preview(tin) → chữ (chưa esc) ở danh sách hội thoại.
const KINDS = {
  text: {
    bubble: (m) => `<p class="whitespace-pre-wrap break-words">${esc(m.body)}</p>`,
    preview: (m) => m.body,
  },
};
const UNKNOWN_KIND = {
  bubble: () => `<p class="italic">Loại tin này cần tải lại trang để xem.</p>`,
  preview: () => "Tin nhắn",
};
const kindOf = (kind) => KINDS[kind] || UNKNOWN_KIND;

// ---------------------------------------------------------------- trạng thái
const query = new URLSearchParams(location.search);
const state = {
  me: null, unread: 0, live: "connecting",
  list: "dang-tai", conversations: [],
  active: Number(query.get("c")) || null, thread: "idle", partner: null,
  messages: [], hasOlder: false, loadingOlder: false, olderError: false,
  partnerReadUpTo: 0, typingUntil: 0, newBelow: 0,
  draft: "", notice: "",
};
/** Tin đã hiện nhưng server chưa nhận: clientId → tin (status "sending" | "failed"). Sống qua việc đổi hội thoại. */
const unsent = new Map();
/** Tin SSE đến lúc hội thoại đang tải: gộp vào sau khi tải xong. */
let buffered = [];
/** Mỗi lần mở hội thoại tăng lên; phản hồi của lần mở cũ thì bỏ. */
let threadToken = 0;
let readSent = 0;
let typingSentAt = 0;
let typingTimer = 0;

const conv = (id) => state.conversations.find((c) => c.id === id);
const sortList = () => state.conversations.sort((a, b) => (b.lastAt || "").localeCompare(a.lastAt || ""));
const lastConfirmedId = () => state.messages.reduce((max, m) => (m.id > max ? m.id : max), 0);
// Tin đã có id theo thứ tự id; tin đang gửi (chưa id) xếp sau, giữ thứ tự gõ
const byOrder = (a, b) => (a.id && b.id ? a.id - b.id : a.id ? -1 : b.id ? 1 : 0);

/** Gộp một tin từ server vào hội thoại đang mở. Trả true nếu là tin mới (chưa từng có). */
function upsert(message) {
  settle(message);
  const list = state.messages;
  let index = message.clientId ? list.findIndex((m) => m.mine && m.clientId === message.clientId) : -1;
  if (index < 0) index = list.findIndex((m) => m.id === message.id);
  const item = { ...message, status: "sent" };
  if (index >= 0) list[index] = item;
  else list.push(item);
  list.sort(byOrder);
  return index < 0;
}
/** Server đã nhận tin này: bỏ khỏi hàng chờ gửi. */
function settle(message) {
  const pending = message.clientId && unsent.get(message.clientId);
  if (pending) { pending.status = "sent"; unsent.delete(message.clientId); }
}
function setUnread(count) {
  state.unread = count;
  document.title = count ? `(${count}) Tin nhắn — doite.vn` : "Tin nhắn — doite.vn";
}

// ---------------------------------------------------------------- header
function header() {
  const me = state.me;
  return `<header class="sticky top-0 z-30 border-b border-border-strong bg-surface">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-3 px-4 sm:px-6">
      <a href="/" class="flex min-w-0 items-center gap-2.5 rounded-lg ${ring}" aria-label="doite.vn — trang chủ">
        <span class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-primary text-primary-foreground sm:h-9 sm:w-9">${LOGO}</span>
        <span class="text-base font-bold tracking-tight text-foreground sm:text-lg">doite<b class="font-extrabold text-primary">.vn</b></span>
      </a>
      <div class="flex shrink-0 items-center gap-2">
        <a href="/dang-tin.html" class="${btnPrimary} max-sm:h-9 max-sm:px-3">${icon("plus")}<span class="sm:hidden">Đăng tin</span><span class="max-sm:hidden">Đăng tin đổi tệ</span></a>
        <a href="/tin-nhan.html" aria-current="page" aria-label="Tin nhắn" class="relative inline-flex h-9 w-9 items-center justify-center rounded-xl bg-item-hover text-foreground md:h-10 md:w-10 ${ring}">${icon("message-circle", "h-5 w-5")}</a>
        ${me ? `<a href="/tai-khoan.html" aria-label="Trang cá nhân của ${esc(me.displayName)}" class="inline-flex h-10 max-w-[14rem] items-center gap-2 rounded-xl px-0.5 text-sm font-medium text-foreground transition-colors hover:bg-item-hover md:px-2 md:pr-3 ${ring}">${avatarOf(me.displayName, me.avatarUrl, "h-8 w-8", "text-xs")}<span class="hidden truncate md:inline">${esc(me.displayName)}</span></a>` : ""}
      </div>
    </div>
  </header>`;
}

// ---------------------------------------------------------------- dải trạng thái kết nối
function connBar() {
  if (state.live === "reconnecting") {
    return `<p class="flex items-center justify-center gap-2 border-b border-border bg-warning-bg px-4 py-2 text-xs font-medium text-warning">${SPINNER_SM}Đang kết nối lại…</p>`;
  }
  if (state.live === "offline") {
    return `<p class="flex items-center justify-center gap-2 border-b border-border bg-warning-bg px-4 py-2 text-center text-xs font-medium text-warning">${icon("wifi-off", "h-3.5 w-3.5")}<span>Mất kết nối trực tiếp. Tin mới vẫn tự tải vài giây một lần.</span></p>`;
  }
  return "";
}

// ---------------------------------------------------------------- danh sách hội thoại
function listPane() {
  let body;
  if (state.list === "dang-tai") {
    body = [1, 2, 3].map(() => `<div class="flex items-center gap-3 px-4 py-3"><div class="h-10 w-10 animate-pulse rounded-full bg-[#ececef]"></div><div class="flex-1 space-y-2"><div class="h-3.5 w-28 animate-pulse rounded bg-[#ececef]"></div><div class="h-3 w-40 animate-pulse rounded bg-[#ececef]"></div></div></div>`).join("");
  } else if (state.list === "loi") {
    body = `<div role="alert" class="flex flex-col items-center px-4 py-10 text-center"><span class="flex h-11 w-11 items-center justify-center rounded-full bg-danger-bg text-danger">${icon("wifi-off", "h-5 w-5")}</span><p class="mt-3 text-sm font-semibold text-foreground">Chưa tải được tin nhắn</p><button type="button" data-action="retry" class="${btnPrimary} mt-4">${icon("rotate-cw")}Thử tải lại</button></div>`;
  } else if (!state.conversations.length) {
    body = `<div class="flex flex-col items-center px-6 py-12 text-center"><span class="flex h-11 w-11 items-center justify-center rounded-full bg-background text-muted">${icon("message-circle", "h-5 w-5")}</span><p class="mt-3 text-sm font-semibold text-foreground">Chưa có tin nhắn nào</p><p class="pretty mt-1 text-sm text-muted">Mở trang của một người trên Bảng tin rồi bấm Nhắn tin để bắt đầu.</p><a href="/" class="${btnPrimary} mt-4">Xem Bảng tin</a></div>`;
  } else {
    body = `<ul class="flex flex-col gap-0.5 p-2">${state.conversations.map((c) => {
      const on = c.id === state.active;
      const preview = c.lastAt ? `${c.lastFromMe ? "Bạn: " : ""}${esc(kindOf(c.lastKind || "text").preview({ body: c.lastBody }))}` : "Chưa có tin nhắn";
      return `<li><button type="button" data-open="${c.id}" ${on ? 'aria-current="true"' : ""} class="flex w-full cursor-pointer items-center gap-3 rounded-xl px-3 py-2.5 text-left transition-colors outline-none ${on ? "bg-primary-light" : "hover:bg-[#f4f4f6] focus-visible:bg-[#f4f4f6]"}">
        ${avatarOf(c.displayName, c.avatarUrl)}
        <span class="min-w-0 flex-1">
          <span class="flex items-baseline justify-between gap-2"><span class="truncate text-sm ${c.unread ? "font-semibold" : "font-medium"} text-foreground">${esc(c.displayName)}</span><span class="shrink-0 text-xs text-muted tabular">${shortWhen(c.lastAt)}</span></span>
          <span class="flex items-center justify-between gap-2"><span class="truncate text-sm ${c.unread ? "font-medium text-foreground" : "text-muted"}">${preview}</span>${c.unread ? `<span class="inline-flex h-5 min-w-[1.25rem] shrink-0 items-center justify-center rounded-full bg-primary px-1.5 text-[11px] font-semibold text-primary-foreground tabular" aria-label="${c.unread} tin chưa đọc">${c.unread}</span>` : ""}</span>
        </span>
      </button></li>`;
    }).join("")}</ul>`;
  }
  return `<section id="list-pane" aria-labelledby="list-title" class="${state.active ? "max-md:hidden" : ""} flex min-h-0 flex-col border-border md:border-r">
    <h1 id="list-title" class="border-b border-border px-4 py-3.5 text-base font-semibold text-foreground">Tin nhắn</h1>
    <div class="min-h-0 flex-1 overflow-y-auto">${body}</div>
  </section>`;
}

// ---------------------------------------------------------------- hội thoại
const FAIL_REASONS = {
  "qua-nhieu-lan": "Gửi quá nhiều, đợi vài phút",
  "noi-dung-sai": "Nội dung không hợp lệ",
  "loai-tin-chua-ho-tro": "Loại tin chưa hỗ trợ",
  "khong-tim-thay": "Hội thoại không còn",
};

function statusLine(m, isLastSent) {
  if (m.status === "sending") {
    return `<p class="mt-0.5 flex items-center justify-end gap-1 px-1 text-[11px] text-muted">${SPINNER_SM}Đang gửi…</p>`;
  }
  if (m.status === "failed") {
    return `<p class="mt-0.5 flex items-center justify-end gap-1 px-1 text-[11px] text-danger">${icon("circle-alert", "h-3.5 w-3.5")}<span>${esc(FAIL_REASONS[m.reason] || "Chưa gửi được")}</span>
      <button type="button" data-retry="${esc(m.clientId)}" class="inline-flex h-7 cursor-pointer items-center rounded-lg px-2 font-semibold hover:bg-danger-bg outline-none focus-visible:bg-danger-bg">Gửi lại</button></p>`;
  }
  if (isLastSent) {
    const seen = m.id <= state.partnerReadUpTo;
    return `<p class="mt-0.5 px-1 text-right text-[11px] text-muted" data-receipt="${seen ? "seen" : "sent"}">${seen ? "Đã xem" : "Đã gửi"}</p>`;
  }
  return "";
}

function bubbles() {
  if (state.thread === "dang-tai") return `<div class="flex flex-1 items-center justify-center text-muted">${SPINNER}</div>`;
  if (state.thread === "loi") return `<div role="alert" class="flex flex-1 flex-col items-center justify-center px-4 text-center"><p class="text-sm font-semibold text-foreground">Chưa tải được hội thoại</p><button type="button" data-action="retry-thread" class="${btnPrimary} mt-3">${icon("rotate-cw")}Thử tải lại</button></div>`;
  if (!state.messages.length) return `<div class="flex flex-1 items-center justify-center px-6 text-center text-sm text-muted"><p class="pretty">Chưa có tin nhắn. Gửi lời chào tới ${esc(state.partner?.displayName || "")} ở ô bên dưới.</p></div>`;
  let lastSent = -1;
  state.messages.forEach((m, i) => { if (m.mine && m.id) lastSent = i; });
  let lastDay = "";
  const older = state.hasOlder
    ? `<li class="flex justify-center pb-2"><button type="button" data-action="older" ${state.loadingOlder ? 'aria-busy="true"' : ""} class="${btnSecondary}">${state.loadingOlder ? SPINNER : ""}${state.olderError ? "Chưa tải được, thử lại" : "Xem tin cũ hơn"}</button></li>`
    : "";
  return `<ol class="flex flex-col gap-1.5 px-4 py-4">${older}${state.messages.map((m, i) => {
    const day = dayLabel(m.at);
    const sep = day !== lastDay ? `<li class="my-2 text-center text-xs text-muted">${day}</li>` : "";
    lastDay = day;
    const tone = m.mine ? "rounded-br-md bg-primary text-primary-foreground" : "rounded-bl-md bg-[#f0f0f2] text-foreground";
    return `${sep}<li class="flex flex-col ${m.mine ? "items-end" : "items-start"}" ${m.id ? `data-id="${m.id}"` : ""} data-status="${m.status}">
      <div class="max-w-[80%] rounded-2xl px-3.5 py-2 text-sm ${tone} ${m.status === "sending" ? "opacity-70" : ""}">${kindOf(m.kind).bubble(m)}<p class="mt-0.5 text-right text-[11px] tabular ${m.mine ? "text-white/75" : "text-muted"}">${timeOf(m.at)}</p></div>
      ${m.mine ? statusLine(m, i === lastSent) : ""}
    </li>`;
  }).join("")}</ol>`;
}

function typingLine() {
  const on = state.typingUntil > Date.now() && state.partner;
  return on ? `${esc(state.partner.displayName)} đang soạn tin…` : "";
}
function pill() {
  return state.newBelow
    ? `<button type="button" data-action="to-bottom" class="pointer-events-auto inline-flex h-9 cursor-pointer items-center gap-1.5 rounded-full bg-primary px-4 text-sm font-medium text-primary-foreground shadow-md outline-none hover:bg-primary-hover focus-visible:bg-primary-hover">${icon("arrow-down")}${state.newBelow} tin mới</button>`
    : "";
}

function threadPane() {
  if (!state.active) {
    return `<section class="hidden min-h-0 flex-1 items-center justify-center px-6 text-center text-sm text-muted md:flex"><p>Chọn một cuộc trò chuyện ở bên trái.</p></section>`;
  }
  const p = state.partner;
  return `<section aria-label="Hội thoại${p ? ` với ${esc(p.displayName)}` : ""}" class="flex min-h-0 flex-1 flex-col">
    <div class="flex items-center gap-2 border-b border-border px-2 py-2 md:px-4">
      <button type="button" data-action="back" aria-label="Về danh sách tin nhắn" class="inline-flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center rounded-xl text-foreground hover:bg-item-hover md:hidden ${ring}">${icon("arrow-left", "h-5 w-5")}</button>
      ${p ? `<a href="/nguoi-dung/${encodeURIComponent(p.username)}" class="flex min-w-0 items-center gap-2.5 rounded-xl px-1.5 py-1 hover:bg-item-hover ${ring}">${avatarOf(p.displayName, p.avatarUrl, "h-9 w-9", "text-xs")}<span class="min-w-0"><span class="block truncate text-sm font-semibold text-foreground">${esc(p.displayName)}</span><span class="block truncate text-xs text-muted">@${esc(p.username)} · Xem trang</span></span></a>` : `<span class="h-9"></span>`}
    </div>
    <div class="relative flex min-h-0 flex-1 flex-col">
      <div id="scroller" class="flex min-h-0 flex-1 flex-col overflow-y-auto">${bubbles()}</div>
      <div id="pill" class="pointer-events-none absolute inset-x-0 bottom-2 flex justify-center">${pill()}</div>
    </div>
    <p id="typing" aria-live="polite" class="h-5 truncate px-4 text-xs text-muted">${typingLine()}</p>
    <form id="composer" class="border-t border-border p-3" novalidate>
      <p id="notice" role="alert" class="mb-2 flex items-start gap-2 text-xs text-danger" ${state.notice ? "" : "hidden"}>${icon("circle-alert", "mt-0.5 h-3.5 w-3.5")}<span>${esc(state.notice)}</span></p>
      <div class="flex items-end gap-2">
        <label for="draft" class="sr-only">Tin nhắn</label>
        <textarea id="draft" rows="1" maxlength="1200" placeholder="Nhập tin nhắn" class="max-h-32 min-h-[2.75rem] flex-1 resize-none rounded-xl border border-border-strong bg-surface px-4 py-2.5 text-base text-foreground placeholder:text-muted outline-none focus:border-[var(--border-focus)] focus:ring-2 focus:ring-[var(--ring-focus)] md:min-h-[2.5rem] md:text-sm">${esc(state.draft)}</textarea>
        <button type="submit" aria-label="Gửi" class="${btnPrimary} h-11 w-11 px-0 md:h-10 md:w-10">${icon("send")}</button>
      </div>
      <p class="mt-1.5 hidden text-xs text-muted md:block">Enter để gửi, Shift + Enter để xuống dòng.</p>
    </form>
  </section>`;
}

// ---------------------------------------------------------------- vẽ
// Vẽ cả trang chỉ khi đổi màn (mở hội thoại, quay lại). Sự kiện thời gian thực chỉ vẽ lại phần của nó.
function render({ focusDraft = false } = {}) {
  const draftFocused = document.activeElement?.id === "draft";
  const selection = draftFocused ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  document.getElementById("app").innerHTML = `${header()}
  <main class="mx-auto max-w-5xl px-0 sm:px-6 sm:py-6">
    <div class="flex h-[calc(100dvh-4rem)] flex-col overflow-hidden bg-surface sm:h-[calc(100dvh-7rem)] sm:rounded-2xl sm:border sm:border-border">
      <div id="conn" role="status">${connBar()}</div>
      <div class="grid min-h-0 flex-1 grid-cols-1 md:grid-cols-[20rem_minmax(0,1fr)]">${listPane()}${threadPane()}</div>
    </div>
  </main>`;
  autosize();
  const scroller = $("#scroller");
  if (scroller) { stuck = true; toBottom(scroller); observeContent(); }
  if (focusDraft || draftFocused) {
    const draft = $("#draft");
    if (draft) { draft.focus({ preventScroll: true }); if (selection) draft.setSelectionRange(...selection); }
  }
}
function paintList() {
  const pane = $("#list-pane");
  if (pane) pane.outerHTML = listPane();
}
/** stick: luôn cuộn xuống cuối; keepOffset: giữ nguyên chỗ đang đọc khi chèn tin cũ lên đầu. */
function paintThread({ stick = false, keepOffset = false } = {}) {
  const scroller = $("#scroller");
  if (!scroller) return;
  const atBottom = nearBottom(scroller);
  const fromBottom = scroller.scrollHeight - scroller.scrollTop;
  scroller.innerHTML = bubbles();
  if (keepOffset) { scroller.scrollTop = scroller.scrollHeight - fromBottom; stuck = false; }
  else if (stick || atBottom) { toBottom(scroller); state.newBelow = 0; stuck = true; }
  observeContent();
  paintPill();
}
// Đang ở cuối thì giữ ở cuối kể cả khi nội dung cao lên sau khi vẽ (font, CSS của Tailwind sinh trễ, ảnh).
// Người dùng cuộn lên đọc tin cũ thì `stuck` = false, không giật xuống.
let stuck = true;
/** Vị trí do code cuộn tới; sự kiện scroll ở đúng vị trí này không phải người dùng cuộn. */
let programmaticTop = -1;
function toBottom(scroller) {
  scroller.scrollTop = scroller.scrollHeight;
  programmaticTop = scroller.scrollTop;
}
const contentObserver = new ResizeObserver(() => {
  const scroller = $("#scroller");
  if (scroller && stuck) toBottom(scroller);
});
function observeContent() {
  contentObserver.disconnect();
  const content = $("#scroller > *");
  if (content) contentObserver.observe(content);
}
function paintPill() { const el = $("#pill"); if (el) el.innerHTML = pill(); }
function paintTyping() { const el = $("#typing"); if (el) el.innerHTML = typingLine(); }
function paintConn() { const el = $("#conn"); if (el) el.innerHTML = connBar(); }
function paintNotice() {
  const el = $("#notice");
  if (!el) return;
  el.hidden = !state.notice;
  el.lastElementChild.textContent = state.notice;
}
function autosize() {
  const draft = $("#draft");
  if (!draft) return;
  draft.style.height = "auto";
  draft.style.height = `${Math.min(draft.scrollHeight, 128)}px`;
}

// ---------------------------------------------------------------- dữ liệu
async function api(path, options = {}) {
  const response = await fetch(path, { credentials: "same-origin", ...options, headers: { "Content-Type": "application/json", ...(options.headers || {}) } });
  if (response.status === 401) { location.href = `/dang-nhap.html?tiep=${encodeURIComponent("tin-nhan.html" + location.search)}`; throw new Error("auth"); }
  const data = await response.json().catch(() => ({}));
  if (!response.ok || !data.ok) { const error = new Error(data.reason || "loi"); error.reason = data.reason; error.status = response.status; throw error; }
  return data;
}

async function loadList({ quiet = false } = {}) {
  if (!quiet) { state.list = "dang-tai"; paintList(); }
  try {
    state.conversations = (await api("/api/messages")).conversations;
    state.list = "xong";
    // Hội thoại đang mở và đang xem: không tính chưa đọc (server sẽ nhận /read ngay sau)
    const open = conv(state.active);
    if (open && state.thread === "xong" && !document.hidden) open.unread = 0;
    setUnread(state.conversations.reduce((sum, c) => sum + (c.unread || 0), 0));
  } catch {
    if (!quiet) state.list = "loi";
  }
  paintList();
}

async function openConversation(id, { focus = true } = {}) {
  const token = ++threadToken;
  Object.assign(state, {
    active: id, thread: "dang-tai", partner: conv(id) || null, messages: [],
    hasOlder: false, loadingOlder: false, olderError: false, partnerReadUpTo: 0, typingUntil: 0, newBelow: 0, notice: "",
  });
  buffered = [];
  readSent = 0;
  history.replaceState(null, "", `/tin-nhan.html?c=${id}`);
  render();
  try {
    const data = await api(`/api/messages/${id}`);
    if (token !== threadToken) return;
    state.partner = data.partner;
    state.messages = data.messages.map((m) => ({ ...m, status: "sent" }));
    state.hasOlder = data.hasMore;
    state.partnerReadUpTo = data.partnerReadUpTo || 0;
    state.thread = "xong";
    for (const m of buffered) upsert(m);
    buffered = [];
    // Tin của hội thoại này còn đang gửi / lỗi (người dùng đã rời đi rồi quay lại)
    for (const m of unsent.values()) {
      if (m.conversationId === id && !state.messages.some((x) => x.clientId === m.clientId)) state.messages.push(m);
    }
    state.messages.sort(byOrder);
  } catch (error) {
    if (token !== threadToken || error.message === "auth") return;
    state.thread = "loi";
  }
  render({ focusDraft: focus });
  markRead();
}

/** Lấy bù sau khi nối lại / khi tải định kỳ: tin mới hơn tin cuối đang có, và danh sách hội thoại. */
async function catchUp({ list = true } = {}) {
  if (list) loadList({ quiet: true });
  if (!state.active) return;
  if (state.thread === "loi") return openConversation(state.active, { focus: false });
  if (state.thread !== "xong") return;
  const token = threadToken;
  try {
    for (let page = 0; page < 20; page++) {
      const data = await api(`/api/messages/${state.active}?after=${lastConfirmedId()}`);
      if (token !== threadToken) return;
      const scroller = $("#scroller");
      const atBottom = scroller && nearBottom(scroller);
      let added = 0;
      for (const m of data.messages) if (upsert(m) && !m.mine) added++;
      if (data.partnerReadUpTo > state.partnerReadUpTo) state.partnerReadUpTo = data.partnerReadUpTo;
      if (added && !atBottom) state.newBelow += added;
      paintThread();
      if (!data.hasMore) break;
    }
    markRead();
  } catch {}
}

async function loadOlder() {
  const first = state.messages.find((m) => m.id)?.id;
  if (state.loadingOlder || !state.hasOlder || !first) return;
  const token = threadToken;
  state.loadingOlder = true;
  state.olderError = false;
  paintThread({ keepOffset: true });
  try {
    const data = await api(`/api/messages/${state.active}?before=${first}`);
    if (token !== threadToken) return;
    const known = new Set(state.messages.map((m) => m.id));
    state.messages.unshift(...data.messages.filter((m) => !known.has(m.id)).map((m) => ({ ...m, status: "sent" })));
    state.hasOlder = data.hasMore;
  } catch {
    state.olderError = true;
  }
  state.loadingOlder = false;
  paintThread({ keepOffset: true });
  $('[data-action="older"]')?.focus({ preventScroll: true });
}

/** Đánh dấu đã xem — chỉ khi người dùng thật sự đang nhìn hội thoại. */
function markRead() {
  if (!state.active || state.thread !== "xong" || document.hidden) return;
  const upTo = state.messages.reduce((max, m) => (!m.mine && m.id > max ? m.id : max), 0);
  if (!upTo || upTo <= readSent) return;
  readSent = upTo;
  const id = state.active;
  api(`/api/messages/${id}/read`, { method: "POST", body: JSON.stringify({ upTo }) }).catch(() => { if (state.active === id) readSent = 0; });
  const item = conv(id);
  if (item?.unread) { item.unread = 0; paintList(); }
}

// ---------------------------------------------------------------- gửi
function send() {
  const body = state.draft.trim();
  if (!body || !state.active || state.thread !== "xong") return;
  if ([...body].length > 1000) {
    state.notice = "Tin nhắn tối đa 1.000 ký tự, hãy tách làm nhiều tin.";
    return paintNotice();
  }
  state.draft = "";
  state.notice = "";
  const draft = $("#draft");
  if (draft) draft.value = "";
  autosize();
  paintNotice();
  const message = { clientId: uuid(), conversationId: state.active, mine: true, kind: "text", body, meta: null, at: new Date().toISOString(), status: "sending" };
  unsent.set(message.clientId, message);
  state.messages.push(message);
  const item = conv(state.active);
  if (item) { Object.assign(item, { lastBody: body, lastKind: "text", lastFromMe: true, lastAt: message.at }); sortList(); paintList(); }
  paintThread({ stick: true });
  flush();
}

let flushing = false;
/** Gửi lần lượt từng tin đang chờ, đúng thứ tự gõ. */
async function flush() {
  if (flushing) return;
  flushing = true;
  let next;
  while ((next = [...unsent.values()].find((m) => m.status === "sending"))) {
    const message = next;
    try {
      const data = await api(`/api/messages/${message.conversationId}`, {
        method: "POST",
        body: JSON.stringify({ kind: message.kind, body: message.body, meta: message.meta, clientId: message.clientId }),
      });
      settle(data.message);
      if (message.conversationId === state.active && state.thread === "xong") upsert(data.message);
    } catch (error) {
      if (error.message === "auth") break;
      if (unsent.has(message.clientId)) { message.status = "failed"; message.reason = error.reason || ""; }
    }
    if (message.conversationId === state.active) paintThread();
  }
  flushing = false;
}
/** Nối lại được thì tự gửi lại các tin hỏng vì mạng (không gửi lại tin bị server từ chối). */
function retryNetworkFailures() {
  let any = false;
  for (const m of unsent.values()) if (m.status === "failed" && !m.reason) { m.status = "sending"; any = true; }
  if (any) { paintThread(); flush(); }
}

function sendTyping() {
  if (!state.active || state.thread !== "xong" || !state.draft.trim() || Date.now() - typingSentAt < 3000) return;
  typingSentAt = Date.now();
  api(`/api/messages/${state.active}/typing`, { method: "POST" }).catch(() => {});
}

// ---------------------------------------------------------------- thời gian thực
let connTimer = 0;
let fallbackTicks = 0;
doiteLive.start({
  keepWhenHidden: true,
  onStatus(status) {
    clearTimeout(connTimer);
    // Rớt mạng thoáng qua (dưới 2 giây) thì không báo, tránh dải nhấp nháy
    if (status === "reconnecting") connTimer = setTimeout(() => { state.live = status; paintConn(); }, 2000);
    else { state.live = status; paintConn(); }
  },
  fallback() { catchUp({ list: ++fallbackTicks % 3 === 0 }); },
  on: {
    ready(data, { reconnected }) {
      setUnread(data.unread ?? state.unread);
      if (reconnected) catchUp();
      retryNetworkFailures();
    },
    message({ conversationId, message, partner }) {
      let item = conv(conversationId);
      if (!item && partner) {
        item = { id: conversationId, username: partner.username, displayName: partner.displayName, avatarUrl: partner.avatarUrl, unread: 0 };
        state.conversations.unshift(item);
        if (state.list !== "loi") state.list = "xong";
      }
      const viewing = conversationId === state.active && state.thread === "xong" && !document.hidden;
      if (item) {
        Object.assign(item, { lastBody: message.body, lastKind: message.kind, lastAt: message.at, lastFromMe: message.mine });
        if (!message.mine && !viewing) item.unread = (item.unread || 0) + 1;
        sortList();
        paintList();
      }
      settle(message);
      if (conversationId !== state.active) return;
      if (state.thread !== "xong") { buffered.push(message); return; }
      const scroller = $("#scroller");
      const atBottom = scroller && nearBottom(scroller);
      const added = upsert(message);
      if (!message.mine) { state.typingUntil = 0; paintTyping(); }
      if (added && !message.mine && !atBottom) state.newBelow += 1;
      paintThread({ stick: message.mine });
      markRead();
    },
    read({ conversationId, upTo }) {
      if (conversationId === state.active && upTo > state.partnerReadUpTo) {
        state.partnerReadUpTo = upTo;
        paintThread();
      }
    },
    typing({ conversationId }) {
      if (conversationId !== state.active) return;
      state.typingUntil = Date.now() + 6000;
      paintTyping();
      clearTimeout(typingTimer);
      typingTimer = setTimeout(paintTyping, 6100);
    },
    unread({ count }) { setUnread(count); },
    "conversation-read"({ conversationId }) {
      const item = conv(conversationId);
      if (item?.unread) { item.unread = 0; paintList(); }
    },
    resync() { catchUp(); },
  },
});

// ---------------------------------------------------------------- sự kiện giao diện
document.addEventListener("click", (event) => {
  const open = event.target.closest("[data-open]");
  if (open) return openConversation(Number(open.dataset.open));
  const retry = event.target.closest("[data-retry]");
  if (retry) {
    const message = unsent.get(retry.dataset.retry);
    if (message) { message.status = "sending"; message.reason = ""; paintThread(); flush(); }
    return;
  }
  const action = event.target.closest("[data-action]")?.dataset.action;
  if (action === "back") {
    threadToken++;
    state.active = null;
    history.replaceState(null, "", "/tin-nhan.html");
    render();
    $("[data-open]")?.focus();
  }
  if (action === "retry") loadList();
  if (action === "retry-thread") openConversation(state.active);
  if (action === "older") loadOlder();
  if (action === "to-bottom") {
    const scroller = $("#scroller");
    toBottom(scroller);
    stuck = true;
    state.newBelow = 0;
    paintPill();
    $("#draft")?.focus({ preventScroll: true });
  }
});
document.addEventListener("scroll", (event) => {
  if (event.target.id !== "scroller") return;
  // Sự kiện của lần cuộn do code (đến trễ, khi nội dung có thể đã cao thêm) thì giữ nguyên `stuck`
  if (Math.abs(event.target.scrollTop - programmaticTop) >= 2) stuck = nearBottom(event.target);
  if (state.newBelow && stuck) { state.newBelow = 0; paintPill(); }
}, true);
document.addEventListener("submit", (event) => {
  if (event.target.id === "composer") { event.preventDefault(); send(); }
});
document.addEventListener("input", (event) => {
  if (event.target.id !== "draft") return;
  state.draft = event.target.value;
  autosize();
  if (state.notice && [...state.draft.trim()].length <= 1000) { state.notice = ""; paintNotice(); }
  sendTyping();
});
document.addEventListener("keydown", (event) => {
  if (event.target.id === "draft" && event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    send();
  }
});
// Quay lại tab: đánh dấu đã xem những tin đến lúc tab ẩn
document.addEventListener("visibilitychange", () => { if (!document.hidden) markRead(); });
// Có mạng lại: gửi lại tin hỏng vì mất mạng (kể cả khi kết nối SSE chưa kịp đứt)
addEventListener("online", retryNetworkFailures);

// ---------------------------------------------------------------- khởi động
(async () => {
  render();
  try {
    const me = await api("/api/auth/me");
    state.me = me.user;
    render();
  } catch (error) {
    if (error.message === "auth") return;
  }
  await loadList();
  const target = query.get("u");
  if (target) {
    try {
      const { conversationId } = await api("/api/messages/start", { method: "POST", body: JSON.stringify({ username: target }) });
      const tin = query.get("tin");
      if (tin) state.draft = `Chào bạn, mình muốn chào giá cho tin ${tin} của bạn.`;
      await loadList({ quiet: true });
      return openConversation(conversationId);
    } catch {
      // Không mở được (người dùng không tồn tại, hay là chính mình): ở lại danh sách
    }
  }
  if (state.active) openConversation(state.active, { focus: false });
})();
</script>
</body>
</html>
