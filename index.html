  <!-- Allowlisted Tailwind Script (Tailwind v3 play CDN) -->
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script>
    // Token màu đặt ở :root (khối style bên dưới); Tailwind chỉ trỏ tên lớp vào biến.
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["var(--app-font)"] },
          colors: {
            background: "var(--background)",
            surface: "var(--surface)",
            foreground: "var(--foreground)",
            muted: "var(--muted)",
            border: "var(--border)",
            "border-strong": "var(--border-strong)",
            primary: { DEFAULT: "var(--primary)", hover: "var(--primary-hover)", foreground: "var(--primary-foreground)", light: "var(--primary-light)" },
            "item-hover": "var(--item-hover)",
            success: { DEFAULT: "var(--success)", bg: "var(--success-bg)" },
            warning: { DEFAULT: "var(--warning)", bg: "var(--warning-bg)" },
            danger: { DEFAULT: "var(--danger)", bg: "var(--danger-bg)" },
          },
          boxShadow: { popover: "var(--elevation-popover)" },
        },
      },
    };
  </script>
  <style>
    /* Token của doite.vn. Màu nhấn xanh dương #2563eb theo DESIGN.md: đổi ở đây là đổi cả trang. */
    :root {
      color-scheme: light;
      --app-font: "Be Vietnam Pro", "Inter", ui-sans-serif, system-ui, sans-serif;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-foreground: #ffffff;
      --primary-light: #eff6ff;
      --background: #f4f4f6;
      --surface: #ffffff;
      --foreground: #2c2c2c;
      --muted: #707070;
      --border: #f0f0f2;
      --border-strong: #d4d4d8;
      --border-focus: var(--primary);
      --ring-focus: color-mix(in srgb, var(--primary) 15%, transparent);
      --elevation-popover: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
      --item-hover: #e8e8ec;
      /* Xanh lá đậm: chữ nhỏ trên nền trắng cần từ 4.5:1 (#16a34a chỉ 3.3:1) */
      --success: #15803d;
      --success-bg: #f0fdf4;
      --warning: #b45309;
      --warning-bg: #fffbeb;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      /* Màu theo loại tin (chấm trước nhãn) */
      --cat-sell: #15803d;
      --cat-buy: #2563eb;
      --cat-pay: #7c3aed;
    }
    body { font-family: var(--app-font); background: var(--background); color: var(--foreground); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    /* Tailwind v3: class display (grid, flex) đè thuộc tính hidden; giữ hidden luôn thắng. */
    [hidden] { display: none !important; }
    /* Thanh cuộn mảnh */
    * { scrollbar-width: thin; scrollbar-color: #c4c4c8 transparent; }
    .scrollbar-none { scrollbar-width: none; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    /* Hàng tab cuộn ngang trên điện thoại: mép phải mờ báo còn mục */
    .fade-right { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); }
    @media (min-width: 1024px) { .fade-right { -webkit-mask-image: none; mask-image: none; } }
    /* Hàng tab: điện thoại 4 tab chia đều (không cuộn); 640–1023px cuộn ngang thì mới mờ mép phải */
    @media (min-width: 640px) and (max-width: 1023px) { .sm\:fade-right { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); } }
    .tabular { font-variant-numeric: tabular-nums; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 9999px; background: currentColor; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
  <!-- Hiệu ứng chuyển trang (page-transitions.css), bản dự phòng cho trình duyệt cũ (page-transitions.js) -->
  <link rel="stylesheet" href="page-transitions.css" />

<body>
  <div id="app"></div>

<script>
// ---------------------------------------------------------------- icons (SVG nội tuyến, không CDN — CSP)
const ICONS = {
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  "arrow-right-left": '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
  "chevron-right": '<path d="m9 18 6-6-6-6"/>',
  "chevron-down": '<path d="m6 9 6 6 6-6"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  "arrow-up-down": '<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  "shield-check": '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  "badge-check": '<path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  "search-x": '<path d="m13.5 8.5-5 5"/><path d="m8.5 8.5 5 5"/><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  "wifi-off": '<path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>',
  "triangle-alert": '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  "message-circle": '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  "rotate-cw": '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
};
const icon = (name, cls = "h-4 w-4") =>
  `<svg class="${cls} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

// ---------------------------------------------------------------- dữ liệu mẫu (thay bằng API)
const fmt = (n) => n.toLocaleString("vi-VN");
const REFERENCE = { buy: 3520, sell: 3545, mid: 3530, updated: "1 phút trước" };
const TYPES = {
  sell: { label: "Cần bán CNY", cat: "var(--cat-sell)" },
  buy: { label: "Cần mua CNY", cat: "var(--cat-buy)" },
  pay: { label: "Nạp Alipay / 1688", cat: "var(--cat-pay)" },
};
// Bảng tin: đọc từ server Rust (GET /api/posts, MySQL). channels: khoá dùng cho bộ lọc Kênh.
let POSTS = [];
let COUNTS = { all: 0, buy: 0, sell: 0, pay: 0 };
let postsState = "dang-tai"; // "dang-tai" | "xong" | "loi"
let CURRENT_USER = null; // { username, displayName } khi đã đăng nhập (GET /api/auth/me)
let UNREAD_MESSAGES = 0; // số tin nhắn chưa đọc (GET /api/messages/unread), chấm đỏ trên nút tin nhắn

function agoText(seconds) {
  if (seconds < 60) return "Vừa xong";
  if (seconds < 3600) return `${Math.floor(seconds / 60)} phút trước`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)} giờ trước`;
  return `${Math.floor(seconds / 86400)} ngày trước`;
}
function initialsOf(name) {
  const words = name.trim().split(/\s+/);
  const letters = words.length > 1 ? words[0][0] + words[words.length - 1][0] : words[0].slice(0, 2);
  return letters.toUpperCase();
}
function escrowText(vnd) {
  return vnd >= 1e9 ? `${(vnd / 1e9).toLocaleString("vi-VN", { maximumFractionDigits: 1 })} tỷ` : `${(vnd / 1e6).toLocaleString("vi-VN", { maximumFractionDigits: 0 })}tr`;
}
function toPost(row) {
  const escrow = row.escrowVnd > 0;
  const verified = !escrow && row.businessVerified;
  const success = row.successPermille == null ? "" : ` · ${(row.successPermille / 10).toLocaleString("vi-VN", { maximumFractionDigits: 1 })}%`;
  const trust = escrow ? `Ký quỹ ${escrowText(row.escrowVnd)}`
    : verified ? "Doanh nghiệp đã xác thực"
    : row.tradesCount > 0 ? `${fmt(row.tradesCount)} giao dịch${success}`
    : "Thành viên mới";
  return {
    id: row.id, type: row.kind, amount: row.amountCny, rate: row.rateVnd,
    channel: row.channelLabel, channels: row.channels.split(",").filter(Boolean), limit: row.limitLabel,
    ago: agoText(row.ageSeconds), user: row.displayName, initials: initialsOf(row.displayName),
    trust, escrow, verified, avatarUrl: row.avatarUrl || null, mine: row.mine === true, username: row.username,
    // Hạn nhận chào giá thật (tin đăng mới); còn dưới 1 giờ thì báo màu cam
    urgent: row.urgentLabel || (row.expiresInSeconds != null && row.expiresInSeconds < 3600
      ? `Hết hạn chào giá sau ${Math.max(1, Math.ceil(row.expiresInSeconds / 60))} phút` : ""),
  };
}
const escHtml = (text) => String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

async function loadPosts() {
  postsState = "dang-tai";
  if (document.getElementById("list")) refreshList();
  try {
    const response = await fetch("/api/posts", { credentials: "same-origin" });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.reason || response.status);
    // Chữ do người dùng nhập (tên, kênh, hạn mức) được escape trước khi vào HTML
    POSTS = data.posts.map((row) => {
      const post = toPost(row);
      for (const key of ["channel", "limit", "user", "urgent", "initials"]) post[key] = escHtml(post[key]);
      return post;
    });
    COUNTS = { all: POSTS.length, buy: 0, sell: 0, pay: 0 };
    for (const post of POSTS) COUNTS[post.type] = (COUNTS[post.type] || 0) + 1;
    postsState = "xong";
  } catch {
    postsState = "loi";
  }
  refreshFilters();
  refreshList();
  highlightNewPost();
}

// Vừa đăng tin (index.html?moi=<id>): báo đã đăng, tô sáng tin đó, cuộn tới; bỏ ?moi khỏi địa chỉ.
function highlightNewPost() {
  const id = new URLSearchParams(location.search).get("moi");
  if (!id || postsState !== "xong") return;
  history.replaceState(null, "", location.pathname);
  const row = document.querySelector(`[data-post-id="${CSS.escape(id)}"]`);
  const status = document.getElementById("post-status");
  status.innerHTML = `${icon("check", "h-4 w-4")}<span>Đã đăng tin. Thương nhân sẽ chào giá cho bạn tại đây.</span>`;
  status.hidden = false;
  if (!row) return;
  row.classList.add("ring-2", "ring-inset", "ring-[color:var(--primary)]");
  row.scrollIntoView({ behavior: "smooth", block: "center" });
  setTimeout(() => row.classList.remove("ring-2", "ring-inset", "ring-[color:var(--primary)]"), 6000);
}

async function loadCurrentUser() {
  try {
    const response = await fetch("/api/auth/me", { credentials: "same-origin" });
    const data = await response.json();
    CURRENT_USER = response.ok && data.ok ? data.user : null;
    if (CURRENT_USER) {
      const unread = await fetch("/api/messages/unread", { credentials: "same-origin" }).then((r) => r.json()).catch(() => ({}));
      UNREAD_MESSAGES = unread.count || 0;
      // Có tin mới thì chấm đỏ tự cập nhật (SSE /api/events qua live.js)
      doiteLive.watchUnread((count) => { UNREAD_MESSAGES = count; doiteLive.paintBadge(count); });
    }
  } catch {
    CURRENT_USER = null;
  }
  document.getElementById("header-account").innerHTML = accountButtons();
}
// [khoá, nhãn đầy đủ, nhãn ngắn cho điện thoại: 4 tab chia đều một hàng, không phải vuốt ngang]
const TABS = [["all", "Tất cả", "Tất cả"], ["buy", "Cần mua CNY", "Mua tệ"], ["sell", "Cần bán CNY", "Bán tệ"], ["pay", "Nạp Alipay / WeChat", "Thanh toán"]];
const CHANNELS = [["all", "Mọi kênh"], ["alipay", "Alipay"], ["wechat", "WeChat Pay"], ["bank", "Chuyển khoản ngân hàng"], ["taobao", "Quét QR Taobao / 1688"]];
const SORTS = [["new", "Mới nhất"], ["rate", "Tỷ giá cao nhất"], ["amount", "Số lượng lớn nhất"], ["expiring", "Sắp hết hạn"]];
const MERCHANTS = [
  { name: "Hà Tệ Chợ Cửa Khẩu", initials: "HT", orders: "1.240 lệnh", escrow: "Ký quỹ 100tr", rating: "5.0" },
  { name: "Tiểu Thương Bằng Tường", initials: "TN", orders: "890 lệnh", escrow: "Ký quỹ 50tr", rating: "4.9" },
];
const STEPS = [
  "Đăng tin nhu cầu hoặc chọn bài đăng có tỷ giá tốt nhất.",
  "Thương nhân gửi chào giá cạnh tranh. Bạn chọn chào giá tốt nhất.",
  "Kiểm tra tài khoản nhận tiền thật trước khi bấm xác nhận hoàn tất.",
];

// Chỗ nối API / router. Đang để trống có chủ đích.
window.DoiteHandlers = {
  // prefill: { cny } khi bấm "Tạo tin theo giá này". Trang đăng tin tự đưa qua đăng nhập nếu cần.
  onCreatePost: (prefill) => { location.href = prefill?.cny ? `dang-tin.html?cny=${prefill.cny}` : "dang-tin.html"; },
  onLogin: () => { location.href = "dang-nhap.html"; },
  // Chưa đăng nhập thì sang trang đăng nhập, xong quay về đây. Đã đăng nhập: luồng chào giá chưa làm.
  // Đã đăng nhập: luồng chào giá chưa làm, nên mở tin nhắn với người đăng, soạn sẵn câu chào giá cho tin đó.
  onBid: (postId) => {
    const post = POSTS.find((p) => p.id === postId);
    const tin = post ? `${TYPES[post.type].label} ${fmt(post.amount)} ¥` : "";
    if (CURRENT_USER && post) {
      location.href = `tin-nhan.html?${new URLSearchParams({ u: post.username, tin })}`;
      return;
    }
    location.href = `dang-nhap.html?${new URLSearchParams({ tin, tiep: "index.html" })}`;
  },
  onLogout: async () => {
    try { await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); } catch {}
    CURRENT_USER = null;
    document.getElementById("header-account").innerHTML = accountButtons();
    loadPosts(); // bỏ đánh dấu "Tin của bạn"
  },
  onLoadMore: () => {},
  onFiltersChange: (filters) => {},   // gọi API lọc phía máy chủ khi có
};

// Trạng thái xem thử: ?tt=dang-tai | rong | loi
const previewState = new URLSearchParams(location.search).get("tt");
const filters = { tab: "all", amount: 0, channel: "all", sort: "new" };

// ---------------------------------------------------------------- lớp dùng chung (chép từ wireframe A)
const ring = "outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--ring-focus)]";
const btnPrimary = `inline-flex h-10 shrink-0 cursor-pointer items-center justify-center gap-2 rounded-xl bg-primary px-4 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary-hover ${ring}`;
const btnOutline = `inline-flex h-10 shrink-0 cursor-pointer items-center justify-center gap-2 rounded-xl border border-border-strong bg-surface px-4 text-sm font-medium text-foreground transition-colors hover:bg-item-hover ${ring}`;
const btnSmall = `inline-flex h-9 shrink-0 cursor-pointer items-center justify-center whitespace-nowrap rounded-lg bg-primary px-3.5 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary-hover ${ring}`;
const card = "rounded-2xl border border-border bg-surface";
const field = "border border-border-strong bg-surface text-foreground outline-none focus:border-[color:var(--border-focus)] focus:ring-2 focus:ring-[color:var(--ring-focus)]";

function typeBadge(p) {
  return `<span class="inline-flex shrink-0 items-center gap-1.5 text-xs font-medium" style="color:${TYPES[p.type].cat}"><span class="dot"></span>${TYPES[p.type].label}</span>`;
}
function avatar(initials, size = "h-8 w-8", url = null) {
  if (url) return `<img src="${escHtml(url)}" alt="" class="${size} shrink-0 rounded-full bg-[#ececef] object-cover">`;
  return `<span class="${size} inline-flex shrink-0 items-center justify-center rounded-full bg-[#ececef] text-xs font-semibold text-foreground" aria-hidden="true">${initials}</span>`;
}
function trustLine(p) {
  if (p.escrow) return `<span class="inline-flex items-center gap-1 text-xs font-medium text-success">${icon("shield-check", "h-3.5 w-3.5")}${p.trust}</span>`;
  if (p.verified) return `<span class="inline-flex items-center gap-1 text-xs text-muted">${icon("badge-check", "h-3.5 w-3.5")}${p.trust}</span>`;
  return `<span class="text-xs text-muted">${p.trust}</span>`;
}
function rateHtml(p, size = "text-base") {
  return `<span class="${size} whitespace-nowrap font-semibold text-foreground tabular">${fmt(p.rate)}<span class="text-xs font-normal text-muted"> ₫/¥</span></span>`;
}
function urgentLine(p) {
  // max-lg:basis-full: trên điện thoại cảnh báo luôn đứng riêng một hàng (có chủ đích, không lẻ loi)
  return p.urgent ? `<span class="inline-flex items-center gap-1 text-xs font-medium text-warning max-lg:basis-full">${icon("clock", "h-3.5 w-3.5")}${p.urgent}</span>` : "";
}

// ---------------------------------------------------------------- khối 1: header
// Chưa đăng nhập: nút "Đăng nhập" (điện thoại vẫn ghi chữ, không chỉ icon).
// Đã đăng nhập: tên hiển thị (ẩn trên điện thoại cho đủ chỗ) + "Đăng xuất".
function accountButtons() {
  if (!CURRENT_USER) {
    return `<button type="button" data-action="login" class="${btnOutline} max-sm:h-9 max-sm:px-3">${icon("user", "h-4 w-4 max-sm:hidden")}Đăng nhập</button>`;
  }
  // Bấm tên → trang cá nhân (tai-khoan.html: thông tin tài khoản + lịch sử đăng nhập).
  // Dưới 768px header không đủ chỗ cho tên + Đăng xuất: chỉ còn ảnh đại diện tròn dẫn tới trang cá nhân
  // (Đăng xuất nằm trên header trang cá nhân).
  const initials = escHtml(initialsOf(CURRENT_USER.displayName));
  const photo = CURRENT_USER.avatarUrl;

// ---------------------------------------------------------------- khối 3: lọc (dính đầu trang)
function tabs() {
  return `
  <div class="min-w-0 sm:fade-right sm:overflow-x-auto sm:scrollbar-none">
    <div role="tablist" aria-label="Loại tin" class="flex w-full items-center gap-0.5 rounded-xl bg-[#ececef] p-1 sm:w-max sm:gap-1">
      ${TABS.map(([key, label, short]) => `<button type="button" role="tab" data-tab="${key}" aria-selected="${key === filters.tab}" class="inline-flex h-8 flex-auto shrink-0 cursor-pointer items-center justify-center gap-1 whitespace-nowrap rounded-lg px-1 text-[13px] sm:flex-none sm:gap-1.5 sm:px-3 sm:text-sm font-medium transition-colors ${ring} ${key === filters.tab ? "bg-surface text-foreground shadow-[0_1px_2px_rgb(0_0_0/0.08)]" : "text-[#5c5c5c] hover:text-foreground"}"><span class="sm:hidden">${short}</span><span class="max-sm:hidden">${label}</span><span class="text-xs tabular max-[359px]:hidden ${key === filters.tab ? "text-muted" : ""}">${COUNTS[key]}</span></button>`).join("")}

function dropdown(id, items, current, iconName) {
  const label = items.find(([k]) => k === current)[1];
  return `
  <div class="relative shrink-0" data-dd="${id}">
    <button type="button" data-dd-btn aria-haspopup="listbox" aria-expanded="false" class="inline-flex h-10 cursor-pointer items-center gap-2 whitespace-nowrap rounded-xl border border-border-strong bg-surface px-3 text-sm text-foreground hover:bg-item-hover ${ring}">
      ${icon(iconName, "h-4 w-4 text-muted")}<span data-dd-label>${label}</span>${icon("chevron-down", "h-4 w-4 text-muted")}
    </button>
    <div data-dd-menu role="listbox" hidden class="absolute right-0 top-full z-40 mt-1.5 grid w-56 gap-1 rounded-2xl border border-border bg-surface p-1.5 shadow-popover">
      ${items.map(([key, text]) => `<button type="button" role="option" data-value="${key}" aria-selected="${key === current}" class="flex h-10 w-full cursor-pointer items-center justify-between rounded-xl px-3 text-left text-sm text-foreground outline-none hover:bg-item-hover focus-visible:bg-item-hover ${key === current ? "bg-item-hover font-medium" : ""}">${text}${key === current ? icon("check") : ""}</button>`).join("")}
    </div>
  </div>`;
}

function filterBar() {
  return `

      <div id="tabs">${tabs()}</div>
      <div class="flex min-w-0 items-center gap-2">
        <label class="relative min-w-0 flex-1 sm:w-44 sm:flex-none">
          <span class="sr-only">Số tệ cần đổi</span>
          ${icon("search", "pointer-events-none absolute inset-y-0 left-3 my-auto h-4 w-4 text-muted")}
          <input id="filter-amount" placeholder="Số tệ cần đổi" inputmode="numeric" autocomplete="off" class="h-10 w-full rounded-xl pl-9 pr-3 text-sm placeholder:text-muted ${field}" />

        <div id="dd-channel">${dropdown("channel", CHANNELS, filters.channel, "wallet")}</div>
        <div id="dd-sort" class="max-sm:hidden">${dropdown("sort", SORTS, filters.sort, "arrow-up-down")}</div>
      </div>
    </div>
  </section>`;
}

// ---------------------------------------------------------------- khối 4: danh sách
// Tin của chính mình: nền xanh rất nhạt + vạch xanh mép trái + nhãn "Tin của bạn", không có nút Chào giá
// (không tự chào giá tin mình); máy tính ghi "Chờ chào giá" ở cột nút, điện thoại chỉ giữ nhãn để tên không bị cắt. Sắp xếp Mới nhất thì đứng đầu (visiblePosts).
const MINE_ROW = "border-[#bfdbfe] bg-[#f5f8ff] shadow-[inset_3px_0_0_var(--primary)] lg:bg-[#f5f8ff]";
const MINE_BADGE = `<span class="inline-flex h-5 shrink-0 items-center rounded-full bg-primary px-2 text-[11px] font-semibold text-primary-foreground">Tin của bạn</span>`;
function rows(posts) {
  return `
  <!-- Dưới lg: mỗi tin một thẻ riêng, cách nhau 12px trên nền trang (tách tin rõ khi lướt). Từ lg: một bảng chung. -->
  <div class="flex flex-col gap-3 lg:gap-0 lg:overflow-hidden lg:rounded-2xl lg:border lg:border-border lg:bg-surface">
    <div class="hidden grid-cols-[minmax(0,1.3fr)_minmax(0,1fr)_minmax(0,0.8fr)_minmax(0,1.1fr)_auto] gap-4 border-b border-border px-5 py-2.5 text-xs font-medium text-muted lg:grid">
      <span>Người đăng</span><span>Nhu cầu</span><span>Tỷ giá</span><span>Kênh · hạn mức</span><span class="w-24"></span>
    </div>
    <ul class="flex flex-col gap-3 lg:gap-0 lg:divide-y lg:divide-[#e8e8ec]">
      ${posts.map((p) => `
      <li data-post-id="${p.id}" ${p.mine ? 'data-mine="true"' : ""} class="grid grid-cols-1 gap-3 rounded-2xl border px-4 py-4 transition-colors sm:px-5 lg:gap-2 lg:rounded-none lg:border-0 lg:py-4 lg:grid-cols-[minmax(0,1.3fr)_minmax(0,1fr)_minmax(0,0.8fr)_minmax(0,1.1fr)_auto] lg:items-center lg:gap-4 ${p.mine ? MINE_ROW : "border-border bg-surface hover:bg-[#fafafb] lg:bg-transparent lg:hover:bg-[#fafafb]"}">
        <div class="order-3 flex min-w-0 items-center gap-2.5 lg:order-none">
          <!-- Bấm tên hoặc ảnh người đăng → trang công khai của họ (uy tín, tin khác, đánh giá) -->
          <a href="/nguoi-dung/${encodeURIComponent(p.username)}" class="group -m-1 flex min-w-0 items-center gap-2.5 rounded-lg p-1 outline-none focus-visible:bg-item-hover">
            ${avatar(p.initials, "h-8 w-8", p.avatarUrl)}
            <div class="min-w-0"><p class="flex min-w-0 items-center gap-2 text-sm font-medium text-foreground"><span class="truncate underline-offset-2 group-hover:underline">${p.user}</span>${p.mine ? MINE_BADGE : ""}</p><div class="flex flex-wrap items-center gap-x-2">${trustLine(p)}</div></div>
          </a>
          ${p.mine ? "" : `<button type="button" data-bid="${p.id}" class="${btnSmall} ml-auto lg:hidden">Chào giá</button>`}
        </div>
        <div class="order-1 flex min-w-0 items-center justify-between gap-3 lg:order-none lg:block">
          <div class="min-w-0">
            <!-- Điện thoại: thời gian đứng cạnh nhãn loại tin (không rơi xuống đầu dòng dưới tên) -->
            <div class="flex items-center gap-2">${typeBadge(p)}<span class="text-xs text-muted lg:hidden">${p.ago}</span></div>
            <p class="mt-0.5 text-lg font-bold text-foreground tabular lg:text-base">${fmt(p.amount)} <span class="text-sm font-medium text-muted">¥</span></p>
          </div>
          <div class="text-right lg:hidden">${rateHtml(p, "text-lg")}<p class="text-xs text-muted tabular">≈ ${fmt(p.amount * p.rate)} ₫</p></div>
        </div>
        <div class="hidden lg:block">${rateHtml(p)}<p class="text-xs text-muted tabular">≈ ${fmt(p.amount * p.rate)} ₫</p></div>
        <div class="order-2 flex min-w-0 flex-wrap items-center gap-x-3 gap-y-1 text-sm text-foreground lg:order-none lg:block">
          <p class="truncate">${p.channel}</p>
          <p class="truncate text-xs text-muted">${p.limit}</p>
          ${urgentLine(p)}
        </div>
        <div class="hidden w-24 flex-col items-end gap-1 lg:flex">
          ${p.mine ? `<span class="whitespace-nowrap text-right text-xs font-medium text-primary">Chờ chào giá</span>` : `<button type="button" data-bid="${p.id}" class="${btnSmall} w-full">Chào giá</button>`}
          <span class="text-xs text-muted">${p.ago}</span>
        </div>
      </li>`).join("")}
    </ul>
    <!-- Chưa phân trang: server trả tối đa 200 tin mới nhất (src/posts.rs). Có phân trang thì thêm lại nút "Xem thêm N tin" ở đây. -->
  </div>`;
}

function loadingState() {
  return `<div class="flex flex-col gap-3 lg:gap-0 lg:divide-y lg:divide-[#e8e8ec] lg:overflow-hidden lg:rounded-2xl lg:border lg:border-border lg:bg-surface" aria-busy="true" aria-label="Đang tải tin đổi tệ">
    ${[1, 2, 3, 4].map(() => `<div class="flex items-center gap-4 rounded-2xl border border-border bg-surface p-4 lg:rounded-none lg:border-0"><div class="h-8 w-8 animate-pulse rounded-full bg-[#ececef]"></div><div class="flex-1 space-y-2"><div class="h-3.5 w-40 animate-pulse rounded bg-[#ececef]"></div><div class="h-3 w-24 animate-pulse rounded bg-[#ececef]"></div></div><div class="h-5 w-20 animate-pulse rounded bg-[#ececef]"></div><div class="h-9 w-20 animate-pulse rounded-lg bg-[#ececef]"></div></div>`).join("")}
  </div>`;
}
function emptyState() {
  return `<div class="${card} flex flex-col items-center px-4 py-12 text-center">
    <span class="flex h-12 w-12 items-center justify-center rounded-full bg-background text-muted">${icon("search-x", "h-6 w-6")}</span>
    <h3 class="mt-4 text-base font-semibold text-foreground">Chưa có tin hợp bộ lọc này</h3>
    <p class="mt-1 max-w-sm text-sm text-muted">Thử bỏ lọc kênh thanh toán, hoặc đăng tin để thương nhân chào giá cho bạn.</p>
    <div class="mt-5 flex flex-wrap justify-center gap-2"><button type="button" data-action="clear-filters" class="${btnOutline}">Xoá bộ lọc</button><button type="button" data-action="create" class="${btnPrimary}">${icon("plus")}Đăng tin đổi tệ</button></div>
  </div>`;
}
function errorState() {
  return `<div class="flex flex-col items-center rounded-2xl border border-[#fecaca] bg-danger-bg px-4 py-10 text-center" role="alert">
    <span class="flex h-11 w-11 items-center justify-center rounded-full bg-surface text-danger">${icon("wifi-off", "h-5 w-5")}</span>
    <h3 class="mt-3 text-base font-semibold text-foreground">Chưa tải được danh sách tin</h3>
    <p class="mt-1 max-w-sm text-sm text-muted">Mạng bị gián đoạn. Tỷ giá ở trên có thể chưa mới nhất.</p>
    <button type="button" data-action="retry" class="${btnPrimary} mt-4">${icon("rotate-cw")}Thử tải lại</button>
  </div>`;
}

function visiblePosts() {
  let list = POSTS.filter((p) =>
    (filters.tab === "all" || p.type === filters.tab) &&
    (!filters.amount || p.amount >= filters.amount) &&
    (filters.channel === "all" || p.channels.includes(filters.channel)));
  if (filters.sort === "rate") list = [...list].sort((a, b) => b.rate - a.rate);
  if (filters.sort === "amount") list = [...list].sort((a, b) => b.amount - a.amount);
  if (filters.sort === "expiring") list = [...list].sort((a, b) => Boolean(b.urgent) - Boolean(a.urgent));
  // Mới nhất: tin của mình lên đầu (sort ổn định, phần còn lại giữ thứ tự mới nhất)
  if (filters.sort === "new") list = [...list].sort((a, b) => Number(b.mine) - Number(a.mine));
  return list;
}

function listBody() {
  if (previewState === "dang-tai") return loadingState();
  if (previewState === "loi") return errorState();
  if (previewState === "rong") return emptyState();
  if (postsState === "dang-tai") return loadingState();
  if (postsState === "loi") return errorState();
  const posts = visiblePosts();
  return posts.length ? rows(posts) : emptyState();
}

function listSection() {
  return `
  <section aria-labelledby="list-title" class="mx-auto mt-4 max-w-6xl px-4 sm:px-6">
    <div class="mb-3">
      <h1 id="list-title" class="text-lg font-semibold text-foreground sm:text-xl">Bảng tin</h1>
      <!-- Cảnh báo an toàn (người dùng dặn 11/2026): màu hổ phách --warning trên nền --warning-bg, chữ 4.9:1 -->
      <p class="mt-1.5 inline-flex items-start gap-2 rounded-lg border border-[#fde68a] bg-warning-bg px-3 py-2 text-sm font-medium text-warning">${icon("triangle-alert", "mt-0.5 h-4 w-4")}<span>Hãy cẩn thận khi giao dịch với các tài khoản mới</span></p>
      <p id="post-status" role="status" hidden class="mt-2 flex items-start gap-2 rounded-lg border border-[#bbf7d0] bg-success-bg px-3 py-2 text-sm font-medium text-success"></p>
    </div>
    <div id="list">${listBody()}</div>
  </section>`;
}

// ---------------------------------------------------------------- khối 5: thương nhân ký quỹ + 3 bước
function trustSection() {
  return `
  <section aria-label="An toàn giao dịch" class="mx-auto mt-8 grid max-w-6xl grid-cols-1 gap-4 px-4 sm:px-6 lg:grid-cols-2">
    <div class="${card} p-4 sm:p-5">
      <h2 class="text-base font-semibold text-foreground">Thương nhân ký quỹ với sàn</h2>
      <p class="mt-0.5 text-sm text-muted">Đã xác minh danh tính, tiền ký quỹ đứng ra bảo đảm giao dịch.</p>
      <ul class="mt-3 divide-y divide-border">
        ${MERCHANTS.map((m) => `<li class="flex items-center gap-3 py-3">${avatar(m.initials, "h-9 w-9")}<div class="min-w-0 flex-1"><p class="truncate text-sm font-medium text-foreground">${m.name}</p><p class="text-xs text-muted">${m.orders} · <span class="text-success">${m.escrow}</span></p></div><span class="inline-flex items-center gap-1 text-sm font-medium tabular">${icon("star", "h-3.5 w-3.5 text-warning")}${m.rating}</span></li>`).join("")}
      </ul>
    </div>
    <div class="${card} p-4 sm:p-5">
      <h2 class="text-base font-semibold text-foreground">3 bước giao dịch an toàn</h2>
      <ol class="mt-3 grid gap-3">
        ${STEPS.map((s, i) => `<li class="flex gap-3"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-background text-xs font-semibold tabular">${i + 1}</span><span class="text-sm text-foreground">${s}</span></li>`).join("")}
      </ol>
    </div>
  </section>`;
}

// ---------------------------------------------------------------- khối 6: footer
function footer() {
  const link = `inline-flex min-h-8 items-center rounded-md hover:text-foreground hover:underline underline-offset-4 ${ring}`;
  return `
  <footer class="mt-10 border-t border-border-strong bg-surface">
    <div class="mx-auto flex max-w-6xl flex-col gap-3 px-4 py-6 text-sm text-muted sm:px-6 lg:flex-row lg:items-center lg:justify-between">
      <p><b class="text-foreground">doite.vn</b> · © 2026 Nền tảng kết nối giao dịch tiền tệ P2P Việt – Trung</p>
      <nav aria-label="Chính sách" class="flex flex-col gap-x-5 sm:flex-row sm:flex-wrap"><a href="#" class="${link}">Quy định giao dịch an toàn</a><a href="#" class="${link}">Điều khoản thương nhân</a><a href="#" class="${link}">Hỗ trợ khiếu nại</a></nav>
    </div>
  </footer>`;
}

// ---------------------------------------------------------------- render + tương tác
function render() {
  document.getElementById("app").innerHTML = `${header()}<main>${rateStrip()}${filterBar()}${listSection()}${trustSection()}</main>${footer()}`;
}
function refreshList() {
  document.getElementById("list").innerHTML = listBody();
  window.DoiteHandlers.onFiltersChange({ ...filters });
}
function refreshFilters() {
  document.getElementById("tabs").innerHTML = tabs();
  document.getElementById("dd-channel").innerHTML = dropdown("channel", CHANNELS, filters.channel, "wallet");
  document.getElementById("dd-sort").innerHTML = dropdown("sort", SORTS, filters.sort, "arrow-up-down");
}
const digits = (s) => Number(String(s).replace(/\D/g, "")) || 0;

function closeMenus(except) {
  document.querySelectorAll("[data-dd-menu]:not([hidden])").forEach((m) => {
    if (m === except) return;
    m.hidden = true;
    m.parentElement.querySelector("[data-dd-btn]").setAttribute("aria-expanded", "false");
  });
}

document.addEventListener("click", (event) => {
  const t = event.target;
  const tab = t.closest("[data-tab]");
  if (tab) { filters.tab = tab.dataset.tab; refreshFilters(); refreshList(); document.querySelector(`[data-tab="${filters.tab}"]`).focus(); return; }

  const ddBtn = t.closest("[data-dd-btn]");
  if (ddBtn) {
    const menu = ddBtn.parentElement.querySelector("[data-dd-menu]");
    const open = menu.hidden;
    closeMenus();
    menu.hidden = !open;
    ddBtn.setAttribute("aria-expanded", String(open));
    if (open) menu.querySelector('[aria-selected="true"]')?.focus();
    return;
  }
  const option = t.closest("[data-dd-menu] [role=option]");
  if (option) {
    const id = option.closest("[data-dd]").dataset.dd;
    filters[id] = option.dataset.value;
    refreshFilters(); refreshList();
    document.querySelector(`[data-dd="${id}"] [data-dd-btn]`).focus();
    return;
  }
  closeMenus();

  if (t.closest("[data-bid]")) { window.DoiteHandlers.onBid(Number(t.closest("[data-bid]").dataset.bid)); return; }
  const action = t.closest("[data-action]")?.dataset.action;
  if (action === "create") window.DoiteHandlers.onCreatePost();
  if (action === "create-at-rate") { event.preventDefault(); window.DoiteHandlers.onCreatePost({ cny: digits(document.getElementById("convert-cny").value) }); }
  if (action === "login") window.DoiteHandlers.onLogin();
  if (action === "logout") window.DoiteHandlers.onLogout();
  if (action === "load-more") window.DoiteHandlers.onLoadMore();
  if (action === "retry") { if (previewState) location.search = ""; else loadPosts(); }
  if (action === "clear-filters") {
    Object.assign(filters, { tab: "all", amount: 0, channel: "all", sort: "new" });
    document.getElementById("filter-amount").value = "";
    refreshFilters(); refreshList();
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    const open = document.querySelector("[data-dd-menu]:not([hidden])");
    if (open) { closeMenus(); open.parentElement.querySelector("[data-dd-btn]").focus(); }
    return;
  }
  // Mũi tên lên/xuống trong menu thả
  const menu = event.target.closest?.("[data-dd-menu]");
  if (menu && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
    event.preventDefault();
    const items = [...menu.querySelectorAll("[role=option]")];
    const i = items.indexOf(document.activeElement);
    items[(i + (event.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
  }
});

document.addEventListener("input", (event) => {
  if (event.target.id === "convert-cny") {
    const cny = digits(event.target.value);
    event.target.value = cny ? fmt(cny) : "";
    document.getElementById("convert-vnd").textContent = fmt(cny * REFERENCE.mid);
  }
  if (event.target.id === "filter-amount") {
    filters.amount = digits(event.target.value);
    event.target.value = filters.amount ? fmt(filters.amount) : "";
    refreshList();
  }
});

render();
if (!previewState) loadPosts();
loadCurrentUser();
</script>
</body>
</html>
