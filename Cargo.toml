[package]
name = "doite"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.5"
axum = "0.8"
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
maxminddb = "0.24"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
